    //初始化所有车辆分布位置
    function initCarLocation(data){
        allData = data;

        // 遍历所有车辆位置信息，生成图表
        for (var i = 0; i < allData.length; i++) {
            if(allData[i].lng !==0 && allData[i].lat !== 0){
                var lnglat = changePosXy(allData[i].lng,allData[i].lat);

                var x = lnglat[0];
                var y = lnglat[1];
                addCarMarker(Number(x),Number(y),allData[i],"/static/car_black.png");
                setCarMarkerStyle();
            }
        }
        
    }

    //车
    function addCarMarker(x,y,data,imgPath){
        console.log(x,y,data,imgPath)
        rmark.addMarker({
            x: x,
            y: y,
            img: imgPath,
            title:'<div style="display:flex">'
                +'<img src="/static/icon_location.png" style="width:20px;height:20px;margin-left:-5px;margin-top:3px;"/>'
                +'<span style="color:#314457;font-weight:600;">'+data.carNumber+'-'+data.carBrand+data.carSeries+'</span>'
                +'</div>',
            content:'<div style="display: flex;">'
                    +'<span style="width:40px;">司机：</span>'
                    +'<span style="width: calc(100% - 40px);">'+data.driver+'</span>'
                    +'</div>'
                    +'<div style="display: flex;">'
                    +'<span style="width:40px;">位置：</span>'
                    +'<span style="width: calc(100% - 40px);">'+data.location+'</span>'
                    +'</div>',
        });
    }

    //设置车辆样式
    function setCarMarkerStyle(){
        //获取车辆控件
        var carImage;
        var imageArr = document.getElementsByTagName('image');
        
        for (var i = 0; i < imageArr.length; i++) {
            if(imageArr[i].href.baseVal==='/static/car_black.png' || imageArr[i].href.baseVal==='/static/car_red.png'){
                carImage = imageArr[i];
                carImage.setAttribute('class','carMarkerImage');
                carImage.setAttribute('width','40px');
                carImage.setAttribute('height','40px');
            }
        }
    }

    //车辆定位并显示信息
    function setCenterPoint(item,position){
        if(currentPosition == -1){
            currentPosition = position;

            locationAt(item);
        }else{
            clearCarChecked();
            currentPosition = position;
            locationAt(item);
        }
    }

    //清除车辆选中状态
    function clearCarChecked(){
        if(currentPosition == -1){
            return;
        }
        var lnglat = changePosXy(allData[currentPosition].lng,allData[currentPosition].lat);

        var centerX = Number(lnglat[0]);
        var centerY = Number(lnglat[1]);

        addCarMarker(centerX,centerY,allData[currentPosition],"/static/car_black.png");
        setCarMarkerStyle();
    }

    //车辆定位
    function locationAt(item){
        var lnglat = changePosXy(item.lng,item.lat);

        var centerX = Number(lnglat[0]);
        var centerY = Number(lnglat[1]);

        addCarMarker(centerX,centerY,item,"/static/car_red.png");
        setCarMarkerStyle();
        // rmark.showMarkerInfo(centerX,centerY)   
        rmark.setMapCenterAt(centerX,centerY);
    }

    //经纬度转墨卡托
    function changePosXy(lng,lat){
        var lnglat = WebMercatorUtilsObj.lngLatToXY(lng,lat);

        return [lnglat[0],lnglat[1]];
    }
